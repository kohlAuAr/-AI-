name: campus-prod
x-logs: &logs
  driver: json-file
  options: { max-size: '10m', max-file: '3' }
services:
  mysql:
    image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      TZ: Asia/Shanghai
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --innodb-buffer-pool-size=256M]
    volumes: [mysql-data:/var/lib/mysql, './mysql-init.sh:/docker-entrypoint-initdb.d/01-campus.sh:ro']
    secrets: [mysql_root_password, business_db_password, ai_db_password]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$(cat /run/secrets/mysql_root_password) mysql -uroot -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    logging: *logs
  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    user: redis
    restart: unless-stopped
    entrypoint: [/bin/sh, /etc/campus/redis-start.sh]
    volumes: [redis-data:/data, './redis-start.sh:/etc/campus/redis-start.sh:ro']
    secrets: [redis_password]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 192m
    logging: *logs
  ai:
    image: campus-ai:${RELEASE:?Set RELEASE to a tested release tag}
    build: { context: .., dockerfile: deploy/backend.Dockerfile, args: { SERVICE: ai-service } }
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: '3306'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      AI_MODE: local
      EMBEDDING_PROVIDER: none
      AI_MODEL_ALLOWED_URLS: ${AI_MODEL_ALLOWED_URLS:?Set exact allowed model endpoints}
      AI_MAX_CONCURRENT_MODEL_REQUESTS: ${AI_MAX_CONCURRENT_MODEL_REQUESTS:-2}
      TZ: Asia/Shanghai
    secrets:
      - { source: ai_db_password, target: spring.datasource.password }
      - { source: redis_password, target: spring.data.redis.password }
      - { source: internal_token, target: service.internal-token }
      - { source: ai_master_key, target: ai-admin.master-key }
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_healthy } }
    healthcheck:
      test: [CMD-SHELL, 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/8091; printf "GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; head -1 <&3 | grep -q "200"''']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    stop_grace_period: 330s
    mem_limit: 1024m
    logging: *logs
  campus:
    image: campus-business:${RELEASE:?Set RELEASE to a tested release tag}
    build: { context: .., dockerfile: deploy/backend.Dockerfile, args: { SERVICE: campus-service } }
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: '3306'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      AI_SERVICE_URL: http://ai:8091
      AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-5}
      AI_DAILY_ACCOUNT_LIMIT: ${AI_DAILY_ACCOUNT_LIMIT:-50}
      AI_DAILY_PLATFORM_LIMIT: ${AI_DAILY_PLATFORM_LIMIT:-1000}
      CAMPUS_BOOTSTRAP_ADMIN_USERNAME: ${ADMIN_USERNAME:-campus_admin}
      TZ: Asia/Shanghai
    secrets:
      - { source: business_db_password, target: spring.datasource.password }
      - { source: redis_password, target: spring.data.redis.password }
      - { source: internal_token, target: service.internal-token }
      - { source: admin_password, target: campus.bootstrap-admin-password }
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_healthy } }
    healthcheck:
      test: [CMD-SHELL, 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/8090; printf "GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; head -1 <&3 | grep -q "200"''']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    mem_limit: 768m
    stop_grace_period: 330s
    logging: *logs
  web:
    image: campus-web:${RELEASE:?Set RELEASE to a tested release tag}
    build: { context: .., dockerfile: deploy/frontend.Dockerfile }
    restart: unless-stopped
    ports: ['${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-80}:80', '${HTTP_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:443']
    volumes: ['./tls:/etc/nginx/tls:ro']
    depends_on: { campus: { condition: service_healthy } }
    mem_limit: 128m
    logging: *logs
volumes:
  mysql-data:
  redis-data:
secrets:
  mysql_root_password: { file: ./secrets/mysql_root_password }
  business_db_password: { file: ./secrets/business_db_password }
  ai_db_password: { file: ./secrets/ai_db_password }
  redis_password: { file: ./secrets/redis_password }
  internal_token: { file: ./secrets/internal_token }
  ai_master_key: { file: ./secrets/ai_master_key }
  admin_password: { file: ./secrets/admin_password }
