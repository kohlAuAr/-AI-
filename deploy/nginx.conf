limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
log_format campus '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
server {
    listen 80 default_server;
    server_name _;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;
    access_log /dev/stdout campus;
    error_log /dev/stderr warn;
    location / { try_files $uri $uri/ /index.html; }
    location ~ ^/(internal|actuator)(/|$) { return 404; }
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/campus-proxy.conf;
    }
    location /api/ { include /etc/nginx/campus-proxy.conf; }
}
