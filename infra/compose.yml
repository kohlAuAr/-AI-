services:
  mysql:
    image: mysql:8.0
    ports:
      - "127.0.0.1:13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your shell}
      MYSQL_DATABASE: campus_business
      MYSQL_USER: campus
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-campus.sql:ro
  redis:
    image: redis:7.0
    ports:
      - "127.0.0.1:16379:6379"
volumes:
  mysql-data:
