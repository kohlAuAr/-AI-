spring:
  lifecycle:
    timeout-per-shutdown-phase: 320s
  config:
    import: 'configtree:/run/secrets/'
  flyway:
    enabled: true
  jpa:
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/campus_business?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: campus_business_app
    hikari:
      maximum-pool-size: 6
server:
  shutdown: graceful
  address: 0.0.0.0
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
campus:
  redis-enabled: true
  ai-daily-quota-enabled: true
  ai-daily-account-limit: ${AI_DAILY_ACCOUNT_LIMIT:50}
  ai-daily-platform-limit: ${AI_DAILY_PLATFORM_LIMIT:1000}
logging:
  level:
    root: INFO
