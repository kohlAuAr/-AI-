server:
  address: 127.0.0.1
  port: ${CAMPUS_PORT:8090}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CAMPUS_SESSION
        http-only: true
        same-site: lax
spring:
  application:
    name: campus-service
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms
  profiles:
    default: demo
  datasource:
    url: jdbc:h2:file:./data/campus;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ''
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
management:
  health:
    redis:
      enabled: ${CAMPUS_REDIS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health
service:
  internal-token: ${AI_INTERNAL_TOKEN:}
campus:
  ai-base-url: ${AI_SERVICE_URL:http://127.0.0.1:8091}
  redis-enabled: ${CAMPUS_REDIS_ENABLED:false}
  ai-requests-per-minute: ${AI_REQUESTS_PER_MINUTE:5}
